



name = "herballeafmarketlive"
main = "src/index.js"
compatibility_date = "2026-07-28"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# npx wrangler d1 create herbal-leaf-market  -> paste database_id
[[d1_databases]]
binding = "HLM_DB"
database_name = "herbal-leaf-market"
database_id = "dd3e781d-3d3f-4167-ac14-ea245efb7704"

# npx wrangler kv namespace create HLM_KV  -> paste id
[[kv_namespaces]]
binding = "HLM_KV"
id = "6c013b464ccd46269fdf77fe786c9f0f"

# Mon 12:00 UTC = weekly click report ; Mon 13:00 UTC = weekly Garden digest
[triggers]
crons = ["0 12 * * 1", "0 13 * * 1"]

[vars]
PUBLIC_URL = "https://herballeafmarket.com"

# Secrets (wrangler secret put ...):
#   ADMIN_PW  RESEND_API_KEY  SITE_FROM_EMAIL  REPORT_EMAIL
